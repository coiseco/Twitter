<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <div class="blackout"></div>
    <section class="banner">
        <div class="banner-wrapper">
            <div class="banner-logo-wrapper">
                <img src="./css/img/logo.svg" alt="image of blue dolphin, its logo of this web-page">
            </div>
            <div class="banner-header-wrapper">
                <h3 class="banner-header-text">
                    Оставайся на связи с друзьями, даже когда их нет рядом
                </h3>
            </div>
            <div class="banner-buttons-wrapper">
                <button class="banner-buttons-sign_up_button button sign-in-button">Зарегистрироваться</button>
                <button class="banner-buttons-sign_in_button button log-in-button">Войти</button>
            </div>
            <div class="banner-img-wrapper">
                <img src="./css/img/banner-img.png"
                    alt="image group of people, seating near the fire in camp and telling histories ">
            </div>
            <div class="banner-score-wrapper" id="scoreWrapper">
            </div>
        </div>
    </section>
    <section class="last-messages">
        <div class="last-messages-wrapper">
            <h4 class="last-messages-header">Последние сообщения</h4>
            <div class="messages_list-wrapper" id="messageWrapper">
                <div class="message-preloader-wrapper" id="message-preloader">
                    <h4 class="message-preloader-text">Загрузка сообщений</h4>
                    <img class="message-preloader-gif" src="./css/img/preloader.gif" alt="анимация загрузки страницы">
                </div>
            </div>
        </div>
    </section>
    <section class="banner">
        <div class="banner-wrapper">
            <div class="banner-header-wrapper">
                <h3 class="banner-header-text">
                    Зарегистрируйтесь
                    и узнайте обо всём первым
                </h3>
            </div>
            <div class="banner-buttons-wrapper">
                <button class="banner-buttons-sign_up_button button sign-in-button">Зарегистрироваться</button>
                <button class="banner-buttons-sign_in_button button log-in-button">Войти</button>
            </div>
        </div>
    </section>
    <aside class="registration aside">
        <div class="registration-wrapper">
            <h4 class="registration-header">Регистрация</h4>
            <form action="/public/assets/formChecker.js" method="post" class="registration-form form">
                <input type="email" id="regEmail" class="registration-form-email form-input email" name="regEmail"
                    placeholder="Электронная почта">
                    <label for="regEmail" class="error-text">Поле не должно быть пустым</label>   
                    <label for="regEmail" class="error-text">Адрес не валидный</label>   
                <input type="password" id="regPass" class="registration-form-password form-input password" name="regPass"
                    placeholder="Пароль">
                    <label for="regPass" class="error-text">Поле не должно быть пустым</label>    
                    <label for="regPass" class="error-text">Пароли не совпадают</label>    
                <input type="password" id="secRegPass" class="registration-form-password form-input secPassword" name="secRegPass"
                    placeholder="Подтверждение пароля">
                    <label for="secRegPass" class="error-text">Поле не должно быть пустым</label>    
                    <label for="secRegPass" class="error-text">Пароли не совпадают</label>    
                <button type="button" class="registration-form-button button form-button">Зарегистрироваться</button>    
            </form>
        </div>
    </aside>
    <aside class="authorization aside">
        <div class="authorization-wrapper">
            <h4 class="authorization-header">Авторизация</h4>
            <form action="/public/assets/formChecker.js" method="post" class="authorization-form form">
                <input type="email" id="authEmail" class="authorization-form-email form-input email" name="authEmail"
                    placeholder="Электронная почта">
                <label for="authEmail" class="error-text">Поле не должно быть пустым</label>   
                <label for="authEmail" class="error-text">Адрес не валидный</label>    
                <input type="password" id="authPassword" class="authorization-form-password form-input"
                    name="authPassword" placeholder="Пароль">
                <label for="authPassword" class="error-text">Поле не должно быть пустым</label>    
                <label for="authPassword" class="error-text">Пароли не совпадают</label>    
                <button type="button" class="authorization-form-button button form-button">Авторизоваться</button>    
            </form>
        </div>
    </aside>
</body>
<script src="/public/assets/formChecker.js" type="module"></script>
<script src="/public/assets/verifyEmail.js" type="module"></script>
<script src="/public/assets/fetchData.js" type="module"></script>
</html>
